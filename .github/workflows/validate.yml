name: Validar MONYS OS

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - growth/kary-real-actions-v8

permissions:
  contents: read

concurrency:
  group: monys-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar lint
        run: npm run lint

      - name: Compilar aplicación
        run: npm run build
